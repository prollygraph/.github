name: Feature request
description: Propose new functionality or a change in behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What problem are you trying to solve, and who is affected by it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed direction
      description: A sketch of the approach, if you have one. Optional.
    validations:
      required: false
